[package]
name = "aurora"
version = "0.1.0"
edition = "2021"
description = "A Unified, Refined, Organized, Resilient Agenda — a maximalist day planner for the macOS terminal"
authors = ["AURORA"]

[[bin]]
name = "aurora"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"
thiserror = "2"
unicode-width = "0.2"
fuzzy-matcher = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
