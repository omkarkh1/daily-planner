<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Cadence" />
    <title>Cadence</title>
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/js/theme.js"></script>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/"><img class="brand-mark" src="/icons/icon.svg" alt="" />Cadence</a>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-btn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
        <div class="menu-wrap">
          <button class="user-btn" id="user-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="user-menu">
            <span class="avatar" id="avatar" aria-hidden="true"></span>
            <span id="username"></span>
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
          </button>
          <div class="menu" id="user-menu" role="menu" hidden></div>
        </div>
      </div>
    </header>

    <main class="page">
      <section class="month-bar" aria-label="Month">
        <button class="icon-btn" id="prev-month" type="button" aria-label="Previous month" title="Previous month (←)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <h1 id="month-label" aria-live="polite"></h1>
        <button class="icon-btn" id="next-month" type="button" aria-label="Next month" title="Next month (→)">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6" /></svg>
        </button>
        <button class="today-pill" id="today-btn" type="button" title="Jump to this month (T)" hidden>This month</button>
      </section>
      <p class="month-summary" id="summary"></p>

      <section class="tracker" id="tracker" aria-label="Habits"></section>

      <section class="notes" aria-labelledby="notes-title">
        <div class="notes-head">
          <h2 id="notes-title">Notes</h2>
          <button class="btn-text" id="new-note" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>New note
          </button>
        </div>
        <div class="notes-list" id="notes-list"></div>
      </section>
    </main>

    <input type="file" id="import-file" accept="application/json,.json" hidden />
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </body>
</html>
